name: Windows release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 打 tag 触发时要把安装包发到 Release 上，所以需要写权限。
# workflow_dispatch 手动跑不会走发布那步，只出 artifact。
permissions:
  contents: write

jobs:
  windows-package:
    name: Build Windows NSIS package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app version v$version"
          }

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer was not generated"
          }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content src-tauri/target/release/bundle/nsis/SHA256SUMS.txt

      - name: Upload immutable unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: sheaf-windows-x64-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # 建成草稿而不是直接发出去：装出来的包是用户唯一真正拿到的东西，
      # 值得在它公开之前过一次人眼。上传、算校验值、写说明这些烦人的活已经自动了，
      # 剩下的只是看一眼再点「Publish release」。
      #
      # 说明正文在 .github/RELEASE_NOTES_TEMPLATE.md，改文案不用动这份 YAML。
      # 那里的 SmartScreen 一段在安装包签名之前不能删——用户第一次运行必然撞上
      # 「未知发布者」，不先讲清楚，普通人会直接把下载删掉。
      - name: Draft the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem "$dir/*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer was not found" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          # 再复制一份不带版本号的：官网的下载按钮指向
          # /releases/latest/download/Sheaf-Setup-x64.exe，那个链接永远跟着最新 Release 走，
          # 前提是每个 Release 里都有这个固定名字的文件。漏传一次，官网按钮就 404。
          $stable = Join-Path $dir "Sheaf-Setup-x64.exe"
          Copy-Item $installer.FullName $stable -Force
          $notes = Get-Content .github/RELEASE_NOTES_TEMPLATE.md -Raw
          $notes = $notes.Replace('{{INSTALLER}}', $installer.Name).Replace('{{SHA256}}', $hash)
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create "${{ github.ref_name }}" "$($installer.FullName)" "$stable" "$dir/SHA256SUMS.txt" --title "Sheaf ${{ github.ref_name }}" --notes-file release-notes.md --draft
          Write-Output "Draft release ${{ github.ref_name }} created. Review it on GitHub, then click Publish release."
