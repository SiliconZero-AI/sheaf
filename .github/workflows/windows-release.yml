name: Windows release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 打 tag 触发时要把安装包发到 Release 上，所以需要写权限。
# workflow_dispatch 手动跑不会走发布那步，只出 artifact。
permissions:
  contents: write

jobs:
  windows-package:
    name: Build Windows NSIS package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app version v$version"
          }

      # 更新包签名。私钥只存在于 Secret 里——本地开发没有它，所以本地打包要加
      # `--no-sign`（`tauri.conf.json` 一旦配了 pubkey，没有私钥的构建会直接失败）。
      # 这跟代码签名证书是两码事：这把钥匙防的是「别人伪造一个更新包推给用户」。
      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis

      # 签名文件没生成就等于这一版发出去没人能自动更新，而且**构建本身不会报错**。
      # 所以在这里显式拦一道：workflow_dispatch 手动跑也走这步，早点暴露密钥配错。
      - name: Verify the updater signature was produced
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*_x64-setup.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer was not generated" }
          if (-not (Test-Path "$($installer.FullName).sig")) {
            throw "No .sig next to $($installer.Name). Check TAURI_SIGNING_PRIVATE_KEY / _PASSWORD secrets."
          }
          Write-Output "Updater signature: $($installer.Name).sig"

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*_x64-setup.exe | Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer was not generated"
          }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content src-tauri/target/release/bundle/nsis/SHA256SUMS.txt

      - name: Upload immutable unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: sheaf-windows-x64-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # 建成草稿而不是直接发出去：装出来的包是用户唯一真正拿到的东西，
      # 值得在它公开之前过一次人眼。上传、算校验值、写说明这些烦人的活已经自动了，
      # 剩下的只是看一眼再点「Publish release」。
      #
      # 说明正文在 .github/RELEASE_NOTES_TEMPLATE.md，改文案不用动这份 YAML。
      # 那里的 SmartScreen 一段在安装包签名之前不能删——用户第一次运行必然撞上
      # 「未知发布者」，不先讲清楚，普通人会直接把下载删掉。
      - name: Draft the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem "$dir/*_x64-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer was not found" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          # 再复制一份不带版本号的：官网的下载按钮指向
          # /releases/latest/download/Sheaf-Setup-x64.exe，那个链接永远跟着最新 Release 走，
          # 前提是每个 Release 里都有这个固定名字的文件。漏传一次，官网按钮就 404。
          $stable = Join-Path $dir "Sheaf-Setup-x64.exe"
          Copy-Item $installer.FullName $stable -Force
          $notes = Get-Content .github/RELEASE_NOTES_TEMPLATE.md -Raw
          $notes = $notes.Replace('{{INSTALLER}}', $installer.Name).Replace('{{SHA256}}', $hash)
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

          # 更新清单。已装的 Sheaf 每次启动来读这一个文件，靠它判断有没有新版。
          #
          # url 用**打了 tag 的固定地址**，不用 /releases/latest/download/：签名是对
          # 具体那串字节算的，tag 地址永远指向跟这份清单同一次构建的产物，对不上是不可能的。
          # notes 装的是这一版真正改了什么，从 CHANGELOG 抽。必须由这里生成、跟着清单一起下发——
          # 用户手上那份 App 是旧版，它的安装包里只有发布它那天的 CHANGELOG，自己讲不出新版改了啥。
          # notesZh 是官方字段之外自己加的，JS 侧通过 update.rawJson 拿得到，中文界面显示它。
          # .sig 必须从 $installer 推出来，绝不能自己再 glob 一次：两次独立匹配可能落到
          # 不同版本的文件上，配出「A 版的签名 + B 版的下载地址」的清单——那样每个用户的
          # 更新都会在签名校验处失败，而 Release 本身看着一切正常。本地实跑撞到过这个。
          $sigPath = "$($installer.FullName).sig"
          if (-not (Test-Path $sigPath)) { throw "No .sig for $($installer.Name); refusing to publish an unupdatable release" }
          $version = "${{ github.ref_name }}".TrimStart("v")

          # 抽不出说明就停。宁可不发，也别推一个「有新版可用」却说不出改了什么的更新。
          # 最常见的原因是 CHANGELOG 里那一段标题还写着「Unreleased / 未发布」没改成版本号。
          $notesEn = node scripts/release-notes.mjs $version CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG.md 里抽不出 $version 的更新说明" }
          $notesZh = node scripts/release-notes.mjs $version CHANGELOG.zh-CN.md
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG.zh-CN.md 里抽不出 $version 的更新说明" }

          $manifest = [ordered]@{
            version  = $version
            notes    = $notesEn
            notesZh  = $notesZh
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sigPath -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($installer.Name)"
              }
            }
          }
          $manifestPath = Join-Path $dir "latest.json"
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path $manifestPath -Encoding utf8
          Write-Output "latest.json for $version -> $($installer.Name)"

          gh release create "${{ github.ref_name }}" "$($installer.FullName)" "$stable" "$sigPath" "$manifestPath" "$dir/SHA256SUMS.txt" --title "Sheaf ${{ github.ref_name }}" --notes-file release-notes.md --draft
          Write-Output "Draft release ${{ github.ref_name }} created. Review it on GitHub, then click Publish release."
