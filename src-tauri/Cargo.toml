[package]
name = "sheaf"
version = "0.1.9"
description = "本地 Markdown 写作 App"
authors = ["Mika"]
license = "MIT"
repository = "https://github.com/SiliconZero-AI/sheaf"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sheaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2"

# 只为了一个函数：AllowSetForegroundWindow（见 lib.rs 的 allow_foreground_handoff）。
# 不是新引入的包——tauri / tao / 各插件已经在编译 windows-sys 0.61，这里只是显式声明用它。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

# 应用内自动更新。限定桌面三平台是官方给的写法（`cargo add --target`）——
# 这个插件不支持移动端，无条件依赖会让将来真去编 iOS/Android 时在依赖解析阶段就炸。
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"
# 删文件要进回收站，不是永久删。tauri-plugin-fs 的 remove() 只会永久删，
# 官方的 move-to-trash 需求（tauri#5680）2022 年开到现在还没做，没有内置能力可用。
# 关掉默认的 chrono：那是给「列出回收站里有什么、什么时候扔的」用的，我们只调 delete()。
# coinit_apartmentthreaded 保留——Windows 上它决定 COM 的公寓模式，不是可选的排场。
trash = { version = "5.2.6", default-features = false, features = ["coinit_apartmentthreaded"] }
